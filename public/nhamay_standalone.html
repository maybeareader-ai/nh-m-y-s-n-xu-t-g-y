<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nhà máy sản xuất gây</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #181515;
      color: #e0e0e0;
      user-select: none;
    }
    .font-pixel {
      font-family: 'VT323', monospace;
    }
    .mc-window {
      background-color: #c6c6c6;
      border: 4px solid #dbdbdb;
      border-top-color: #ffffff;
      border-left-color: #ffffff;
      border-right-color: #555555;
      border-bottom-color: #555555;
      box-shadow: inset 2px 2px 0px #ffffff, inset -2px -2px 0px #373737, 0 10px 30px rgba(0, 0, 0, 0.7);
    }
    .mc-panel {
      background-color: #b8b8b8;
      border: 3px solid #8f8f8f;
      border-top-color: #373737;
      border-left-color: #373737;
      border-right-color: #ffffff;
      border-bottom-color: #ffffff;
    }
    .mc-slot {
      background-color: #8b8b8b;
      border: 3px solid #373737;
      border-bottom-color: #ffffff;
      border-right-color: #ffffff;
      position: relative;
      transition: all 0.15s ease;
    }
    .mc-slot:hover {
      background-color: #9d9d9d;
    }
    .mc-button {
      background-color: #c6c6c6;
      border: 3px solid #373737;
      border-top-color: #ffffff;
      border-left-color: #ffffff;
      border-right-color: #555555;
      border-bottom-color: #555555;
      font-family: 'VT323', monospace;
      cursor: pointer;
    }
    .mc-button:hover {
      background-color: #d6d6d6;
    }
    .mc-button:active {
      border-top-color: #555555;
      border-left-color: #555555;
      border-right-color: #ffffff;
      border-bottom-color: #ffffff;
      transform: translateY(1px);
    }
    .mc-button-green {
      background-color: #438e2d;
      color: #ffffff;
      border: 3px solid #1e4513;
      border-top-color: #6ecc4e;
      border-left-color: #6ecc4e;
      border-right-color: #1e4513;
      border-bottom-color: #1e4513;
      font-family: 'VT323', monospace;
      cursor: pointer;
    }
    .mc-button-green:hover {
      background-color: #51a637;
    }
    .pixelated {
      image-rendering: pixelated;
    }
    .mc-tooltip {
      background: rgba(16, 0, 16, 0.94);
      border: 2px solid #28004f;
      box-shadow: 0 0 0 2px #100010, inset 0 0 8px rgba(40, 0, 79, 0.5);
      font-family: 'VT323', monospace;
      color: #ffffff;
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Âm thanh Web Audio ---
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function playClick() {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      } catch(e) {}
    }
    function playSuccess() {
      try {
        const ctx = getAudioCtx();
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const t = ctx.currentTime + idx * 0.06;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.1, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.35);
        });
      } catch(e) {}
    }

    const DEFAULT_FALLBACK_IMAGE = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64"><rect width="16" height="16" fill="%237e22ce"/><rect x="4" y="4" width="8" height="8" fill="%23facc15"/></svg>';
    const DEFAULT_RESULT_IMAGE = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64"><rect width="16" height="16" fill="%23b45309"/><rect x="4" y="4" width="8" height="8" fill="%23fde047"/></svg>';

    // --- App Component ---
    function App() {
      const [items, setItems] = useState(() => {
        try {
          const s = localStorage.getItem('nhamay_items');
          return s ? JSON.parse(s) : [];
        } catch { return []; }
      });
      const [recipes, setRecipes] = useState(() => {
        try {
          const s = localStorage.getItem('nhamay_recipes');
          return s ? JSON.parse(s) : [];
        } catch { return []; }
      });
      const [trays, setTrays] = useState(() => {
        try {
          const s = localStorage.getItem('nhamay_trays');
          return s ? JSON.parse(s) : [
            { id: 'tray1', title: 'Khay 1' },
            { id: 'tray2', title: 'Khay 2' }
          ];
        } catch {
          return [
            { id: 'tray1', title: 'Khay 1' },
            { id: 'tray2', title: 'Khay 2' }
          ];
        }
      });

      const [slotA, setSlotA] = useState(null);
      const [slotB, setSlotB] = useState(null);
      const [selectedItem, setSelectedItem] = useState(null);

      const [viewMode, setViewMode] = useState('crafting'); // 'crafting' | 'recipe_page'
      const [activeRecipe, setActiveRecipe] = useState(null);

      const [isEditorOpen, setIsEditorOpen] = useState(false);
      const [itemToEdit, setItemToEdit] = useState(null);
      const [editorDefaultTray, setEditorDefaultTray] = useState('tray1');

      const [isNewRecipeModalOpen, setIsNewRecipeModalOpen] = useState(false);
      const [recipeCandidates, setRecipeCandidates] = useState(null);

      const [isRecipeBookOpen, setIsRecipeBookOpen] = useState(false);

      useEffect(() => {
        localStorage.setItem('nhamay_items', JSON.stringify(items));
      }, [items]);
      useEffect(() => {
        localStorage.setItem('nhamay_recipes', JSON.stringify(recipes));
      }, [recipes]);
      useEffect(() => {
        localStorage.setItem('nhamay_trays', JSON.stringify(trays));
      }, [trays]);

      // Tìm công thức trùng khớp
      const matchedRecipe = useMemo(() => {
        if (!slotA || !slotB) return null;
        return recipes.find(r => 
          (r.itemAId === slotA.id && r.itemBId === slotB.id) ||
          (r.itemAId === slotB.id && r.itemBId === slotA.id)
        );
      }, [slotA, slotB, recipes]);

      const handleQuickSlot = (item) => {
        playClick();
        if (!slotA) setSlotA(item);
        else if (!slotB) setSlotB(item);
        else {
          if (item.tray === 'tray1') setSlotA(item);
          else setSlotB(item);
        }
      };

      const handleSaveItem = (saved) => {
        setItems(prev => {
          const idx = prev.findIndex(i => i.id === saved.id);
          if (idx >= 0) {
            const next = [...prev];
            next[idx] = saved;
            return next;
          }
          return [...prev, saved];
        });
        if (slotA?.id === saved.id) setSlotA(saved);
        if (slotB?.id === saved.id) setSlotB(saved);
      };

      const handleDeleteItem = (target) => {
        if (confirm(`Xoá bỏ vật phẩm "${target.name}"?`)) {
          setItems(prev => prev.filter(i => i.id !== target.id));
          if (slotA?.id === target.id) setSlotA(null);
          if (slotB?.id === target.id) setSlotB(null);
          if (selectedItem?.id === target.id) setSelectedItem(null);
        }
      };

      const handleResultClick = () => {
        if (matchedRecipe) {
          playSuccess();
          if (window.confetti) {
            window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
          }
          setActiveRecipe(matchedRecipe);
          setViewMode('recipe_page');
        } else if (slotA && slotB) {
          setRecipeCandidates({ a: slotA, b: slotB });
          setIsNewRecipeModalOpen(true);
        }
      };

      const handleSaveNewRecipe = (newRec) => {
        setRecipes(prev => [...prev, newRec]);
        setIsNewRecipeModalOpen(false);
        setActiveRecipe(newRec);
        setViewMode('recipe_page');
      };

      const handleUpdateRecipe = (updated) => {
        setRecipes(prev => prev.map(r => r.id === updated.id ? updated : r));
        setActiveRecipe(updated);
      };

      const handleResetAll = () => {
        if (confirm('Bạn có chắc muốn xoá sạch toàn bộ dữ liệu để bắt đầu lại?')) {
          setItems([]);
          setRecipes([]);
          setSlotA(null);
          setSlotB(null);
          setSelectedItem(null);
          setViewMode('crafting');
        }
      };

      return (
        <div className="min-h-screen flex flex-col font-sans bg-[#1c1917] text-[#ececec]">
          {/* Header */}
          <header className="bg-[#292524] border-b-2 border-[#44403c] px-4 py-3 shadow">
            <div className="max-w-6xl mx-auto flex items-center justify-between">
              <div 
                className="cursor-pointer font-pixel text-3xl font-bold tracking-wider text-white"
                onClick={() => setViewMode('crafting')}
              >
                NHÀ MÁY SẢN XUẤT GÂY
              </div>

              <div className="flex items-center gap-3">
                <button
                  type="button"
                  onClick={() => setIsRecipeBookOpen(true)}
                  className="mc-button-green px-3 py-1.5 font-pixel text-lg shadow flex items-center gap-1.5"
                >
                  📖 <span>Sách Công Thức ({recipes.length})</span>
                </button>
                <button
                  type="button"
                  onClick={handleResetAll}
                  className="mc-button p-2 text-gray-800 hover:text-red-700"
                  title="Xoá sạch dữ liệu"
                >
                  🔄
                </button>
              </div>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6">
            {viewMode === 'recipe_page' && activeRecipe ? (
              <RecipePageView
                recipe={activeRecipe}
                itemA={items.find(i => i.id === activeRecipe.itemAId)}
                itemB={items.find(i => i.id === activeRecipe.itemBId)}
                onBack={() => setViewMode('crafting')}
                onUpdateRecipe={handleUpdateRecipe}
              />
            ) : (
              <div className="space-y-6">
                {/* Bàn Chế Tạo */}
                <div className="mc-window p-5 max-w-2xl mx-auto shadow-2xl text-gray-900">
                  <div className="flex items-center justify-between border-b-2 border-[#555] pb-2 mb-4">
                    <h2 className="font-pixel text-2xl sm:text-3xl font-bold uppercase">
                      Nhà máy sản xuất gây
                    </h2>
                    {(slotA || slotB) && (
                      <button
                        onClick={() => { setSlotA(null); setSlotB(null); }}
                        className="mc-button px-2.5 py-1 text-sm font-pixel text-gray-800"
                      >
                        Thu Dọn
                      </button>
                    )}
                  </div>

                  <div className="bg-[#a8a8a8] mc-panel p-4 sm:p-6 flex flex-col sm:flex-row items-center justify-between gap-6">
                    {/* 2 ô nguyên liệu */}
                    <div className="flex items-center gap-6">
                      <div className="flex flex-col items-center">
                        <div 
                          className="mc-slot w-20 h-20 sm:w-24 sm:h-24 flex items-center justify-center cursor-pointer relative"
                          onClick={() => setSlotA(null)}
                        >
                          {slotA ? (
                            <img src={slotA.image} alt={slotA.name} className="w-14 h-14 object-contain pixelated" />
                          ) : (
                            <span className="text-gray-500 font-pixel text-xs">Ô 1</span>
                          )}
                        </div>
                        {slotA && <span className="text-xs font-bold mt-1 text-gray-900 truncate max-w-[90px]">{slotA.name}</span>}
                      </div>

                      <div className="flex flex-col items-center">
                        <div 
                          className="mc-slot w-20 h-20 sm:w-24 sm:h-24 flex items-center justify-center cursor-pointer relative"
                          onClick={() => setSlotB(null)}
                        >
                          {slotB ? (
                            <img src={slotB.image} alt={slotB.name} className="w-14 h-14 object-contain pixelated" />
                          ) : (
                            <span className="text-gray-500 font-pixel text-xs">Ô 2</span>
                          )}
                        </div>
                        {slotB && <span className="text-xs font-bold mt-1 text-gray-900 truncate max-w-[90px]">{slotB.name}</span>}
                      </div>
                    </div>

                    {/* Mũi tên */}
                    <div className="text-3xl font-pixel font-bold text-gray-700">➔</div>

                    {/* Ô kết quả */}
                    <div className="flex flex-col items-center">
                      {matchedRecipe ? (
                        <div 
                          className="mc-slot w-20 h-20 sm:w-24 sm:h-24 flex items-center justify-center cursor-pointer border-2 border-yellow-400 bg-yellow-100/20"
                          onClick={handleResultClick}
                        >
                          <img src={matchedRecipe.resultItem.image} alt={matchedRecipe.resultItem.name} className="w-14 h-14 object-contain pixelated animate-pulse" />
                        </div>
                      ) : slotA && slotB ? (
                        <button
                          type="button"
                          onClick={handleResultClick}
                          className="mc-slot w-20 h-20 sm:w-24 sm:h-24 flex flex-col items-center justify-center p-2 bg-[#9c8458] hover:bg-[#b09768] text-amber-100 cursor-pointer"
                        >
                          <span className="text-2xl text-yellow-300 font-bold">+</span>
                          <span className="font-pixel text-xs font-bold text-yellow-200">Tạo Kết Quả</span>
                        </button>
                      ) : (
                        <div className="mc-slot w-20 h-20 sm:w-24 sm:h-24 flex items-center justify-center bg-[#757575] opacity-75">
                          <span className="text-gray-400 font-pixel text-xs">Kết quả</span>
                        </div>
                      )}

                      {matchedRecipe && (
                        <div className="flex flex-col items-center mt-1">
                          <span className="text-xs font-bold text-gray-900 truncate max-w-[130px]">{matchedRecipe.resultItem.name}</span>
                          <button
                            type="button"
                            onClick={() => { setRecipeCandidates({ a: slotA, b: slotB }); setIsNewRecipeModalOpen(true); }}
                            className="mt-1 mc-button px-2 py-0.5 font-pixel text-xs text-gray-800"
                          >
                            Đổi Kết Quả
                          </button>
                        </div>
                      )}
                    </div>
                  </div>

                  {slotA && slotB && !matchedRecipe && (
                    <div className="mt-3 flex justify-center">
                      <button
                        type="button"
                        onClick={() => { setRecipeCandidates({ a: slotA, b: slotB }); setIsNewRecipeModalOpen(true); }}
                        className="mc-button-green px-4 py-2 font-pixel text-lg shadow"
                      >
                        ✦ Tự Tạo Vật Phẩm Kết Quả
                      </button>
                    </div>
                  )}
                </div>

                {/* 2 Khay Chứa Vật Phẩm */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  {trays.map(tray => {
                    const trayItems = items.filter(i => i.tray === tray.id);
                    return (
                      <div key={tray.id} className="mc-window p-4 text-gray-900 flex flex-col justify-between">
                        <div className="flex items-center justify-between border-b-2 border-[#555] pb-2 mb-3">
                          <h3 className="font-pixel text-2xl font-bold tracking-wide">
                            {tray.title} <span className="text-base text-gray-600 font-normal">({trayItems.length})</span>
                          </h3>
                          <button
                            type="button"
                            onClick={() => {
                              setItemToEdit(null);
                              setEditorDefaultTray(tray.id);
                              setIsEditorOpen(true);
                            }}
                            className="mc-button-green px-3 py-1 font-pixel text-base"
                          >
                            + Thêm Mới
                          </button>
                        </div>

                        <div className="bg-[#9c9c9c] mc-panel p-3 grid grid-cols-4 gap-2.5 min-h-[160px] content-start">
                          {trayItems.length === 0 ? (
                            <div className="col-span-4 py-8 text-center font-pixel text-gray-700 text-lg">
                              Khay chưa có vật phẩm nào
                            </div>
                          ) : (
                            trayItems.map(item => (
                              <div
                                key={item.id}
                                className="mc-slot w-16 h-16 sm:w-[72px] sm:h-[72px] flex items-center justify-center cursor-pointer p-1 relative group"
                                onClick={() => handleQuickSlot(item)}
                              >
                                <img src={item.image} alt={item.name} className="w-11 h-11 sm:w-12 sm:h-12 object-contain pixelated" />
                                
                                <div className="absolute top-0 right-0 hidden group-hover:flex gap-0.5 bg-black/80 p-0.5 z-20">
                                  <button
                                    type="button"
                                    onClick={(e) => {
                                      e.stopPropagation();
                                      setItemToEdit(item);
                                      setEditorDefaultTray(item.tray);
                                      setIsEditorOpen(true);
                                    }}
                                    className="text-white hover:bg-blue-600 px-1 text-xs"
                                  >
                                    ✎
                                  </button>
                                  <button
                                    type="button"
                                    onClick={(e) => {
                                      e.stopPropagation();
                                      handleDeleteItem(item);
                                    }}
                                    className="text-white hover:bg-red-600 px-1 text-xs"
                                  >
                                    🗑
                                  </button>
                                </div>
                              </div>
                            ))
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          {/* Modal Thêm / Sửa Vật Phẩm (Đã xoá phẩm cấp, icon mẫu, chỉ số) */}
          {isEditorOpen && (
            <ItemEditorModalView
              itemToEdit={itemToEdit}
              defaultTray={editorDefaultTray}
              trays={trays}
              onSave={(saved) => {
                handleSaveItem(saved);
                setIsEditorOpen(false);
              }}
              onDelete={(target) => {
                handleDeleteItem(target);
                setIsEditorOpen(false);
              }}
              onClose={() => setIsEditorOpen(false)}
            />
          )}

          {/* Modal Tạo Kết Quả (Đã xoá phẩm cấp, icon mẫu, chỉ số) */}
          {isNewRecipeModalOpen && recipeCandidates && (
            <NewRecipeModalView
              itemA={recipeCandidates.a}
              itemB={recipeCandidates.b}
              onSaveRecipe={handleSaveNewRecipe}
              onClose={() => setIsNewRecipeModalOpen(false)}
            />
          )}

          {/* Sách công thức Modal */}
          {isRecipeBookOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="mc-window w-full max-w-2xl max-h-[85vh] flex flex-col text-gray-900 overflow-hidden shadow-2xl">
                <div className="bg-[#2d572c] text-white px-4 py-2.5 flex items-center justify-between border-b-2 border-[#193318]">
                  <h2 className="font-pixel text-2xl">SÁCH CÔNG THỨC ({recipes.length})</h2>
                  <button onClick={() => setIsRecipeBookOpen(false)} className="text-gray-200 hover:text-white p-1">✕</button>
                </div>
                <div className="p-4 overflow-y-auto space-y-2 flex-1 bg-[#b8b8b8]">
                  {recipes.length === 0 ? (
                    <div className="text-center py-10 font-pixel text-xl text-gray-700">
                      Chưa có công thức nào được tạo.
                    </div>
                  ) : (
                    recipes.map(rec => (
                      <div
                        key={rec.id}
                        onClick={() => {
                          setActiveRecipe(rec);
                          setViewMode('recipe_page');
                          setIsRecipeBookOpen(false);
                        }}
                        className="bg-[#d6d6d6] hover:bg-white p-3 border-2 border-[#777] flex items-center justify-between cursor-pointer"
                      >
                        <div className="flex items-center gap-3">
                          <div className="mc-slot w-12 h-12 flex items-center justify-center bg-[#ffd700]/20">
                            <img src={rec.resultItem.image} alt={rec.resultItem.name} className="w-9 h-9 object-contain pixelated" />
                          </div>
                          <div>
                            <div className="font-pixel text-xl font-bold">{rec.resultItem.name}</div>
                            <div className="text-xs text-gray-600">{rec.resultItem.description || 'Bấm để xem chi tiết'}</div>
                          </div>
                        </div>
                        <span className="font-pixel text-sm text-blue-800">Xem Chi Tiết ➔</span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- Modal Tạo/Sửa Vật Phẩm (Hoàn toàn thủ công, không phẩm cấp, không icon mẫu, không chỉ số) ---
    function ItemEditorModalView({ itemToEdit, defaultTray, trays, onSave, onDelete, onClose }) {
      const [name, setName] = useState(itemToEdit ? itemToEdit.name : '');
      const [image, setImage] = useState(itemToEdit ? itemToEdit.image : DEFAULT_FALLBACK_IMAGE);
      const [description, setDescription] = useState(itemToEdit ? itemToEdit.description : '');
      const [tray, setTray] = useState(itemToEdit ? itemToEdit.tray : defaultTray);
      const [urlInput, setUrlInput] = useState('');

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          if (typeof event.target?.result === 'string') setImage(event.target.result);
        };
        reader.readAsDataURL(file);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onSave({
          id: itemToEdit ? itemToEdit.id : `item_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          name: name.trim(),
          image,
          description: description.trim(),
          tray,
          createdAt: itemToEdit ? itemToEdit.createdAt : Date.now(),
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm overflow-y-auto">
          <div className="mc-window w-full max-w-xl text-gray-900 overflow-hidden my-6">
            <div className="bg-[#484848] text-white px-4 py-2.5 flex items-center justify-between border-b-2 border-[#333]">
              <h2 className="font-pixel text-2xl">{itemToEdit ? 'CHỈNH SỬA VẬT PHẨM' : 'TẠO VẬT PHẨM MỚI'}</h2>
              <button type="button" onClick={onClose} className="text-gray-300 hover:text-white">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="p-5 space-y-4">
              <div>
                <label className="block font-pixel text-lg font-bold mb-1">Tên Vật Phẩm *</label>
                <input
                  type="text"
                  required
                  placeholder="Nhập tên vật phẩm..."
                  value={name}
                  onChange={e => setName(e.target.value)}
                  className="w-full px-3 py-2 bg-[#ededed] border-2 border-[#555] text-gray-900 focus:outline-none"
                  autoFocus
                />
              </div>

              <div>
                <label className="block font-pixel text-lg font-bold mb-1">Khay Chứa</label>
                <div className="grid grid-cols-2 gap-2">
                  {trays.map(t => (
                    <button
                      key={t.id}
                      type="button"
                      onClick={() => setTray(t.id)}
                      className={`p-2 border-2 font-pixel text-base text-left ${tray === t.id ? 'border-blue-600 bg-blue-100 font-bold' : 'border-gray-400 bg-gray-100'}`}
                    >
                      {t.title}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block font-pixel text-lg font-bold mb-1">Hình Ảnh</label>
                <div className="space-y-2">
                  <label className="mc-button w-full py-2 text-sm font-pixel flex items-center justify-center gap-2 cursor-pointer bg-gray-200">
                    📂 <span>Tải ảnh từ máy tính</span>
                    <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
                  </label>

                  <div className="flex gap-2">
                    <input
                      type="url"
                      placeholder="Hoặc dán URL ảnh (https://...)"
                      value={urlInput}
                      onChange={e => setUrlInput(e.target.value)}
                      className="flex-1 px-2.5 py-1.5 text-xs bg-[#ededed] border-2 border-[#666]"
                    />
                    <button
                      type="button"
                      onClick={() => { if (urlInput.trim()) { setImage(urlInput.trim()); setUrlInput(''); } }}
                      className="mc-button px-3 py-1 font-pixel text-xs text-gray-800"
                    >
                      Dùng URL
                    </button>
                  </div>
                </div>

                <div className="mt-2 flex items-center gap-3 p-2 bg-[#b0b0b0] border-2 border-[#777]">
                  <div className="w-12 h-12 mc-slot flex items-center justify-center bg-[#c0c0c0] shrink-0">
                    <img src={image} alt="Preview" className="w-9 h-9 object-contain pixelated" />
                  </div>
                  <span className="text-xs text-gray-700">Hình ảnh đang chọn</span>
                </div>
              </div>

              <div>
                <label className="block font-pixel text-lg font-bold mb-1">Chú Thích / Mô Tả</label>
                <textarea
                  rows={3}
                  placeholder="Nhập chú thích của vật phẩm..."
                  value={description}
                  onChange={e => setDescription(e.target.value)}
                  className="w-full px-3 py-1.5 bg-[#ededed] border-2 border-[#555] text-sm focus:outline-none"
                />
              </div>

              <div className="flex items-center justify-between pt-3 border-t border-gray-400">
                <div>
                  {itemToEdit && (
                    <button
                      type="button"
                      onClick={() => onDelete(itemToEdit)}
                      className="mc-button px-3 py-1.5 font-pixel text-red-700 text-sm hover:bg-red-100"
                    >
                      🗑 Xoá Vật Phẩm
                    </button>
                  )}
                </div>
                <div className="flex gap-2">
                  <button type="button" onClick={onClose} className="mc-button px-4 py-1.5 font-pixel text-lg">
                    Hủy
                  </button>
                  <button type="submit" className="mc-button-green px-5 py-1.5 font-pixel text-lg">
                    Lưu Lại
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- Modal Tự Tay Tạo Kết Quả Công Thức ---
    function NewRecipeModalView({ itemA, itemB, onSaveRecipe, onClose }) {
      const [name, setName] = useState('');
      const [image, setImage] = useState(DEFAULT_RESULT_IMAGE);
      const [description, setDescription] = useState('');
      const [story, setStory] = useState('');
      const [customUrl, setCustomUrl] = useState('');

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          if (typeof event.target?.result === 'string') setImage(event.target.result);
        };
        reader.readAsDataURL(file);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onSaveRecipe({
          id: `recipe_${Date.now()}`,
          itemAId: itemA.id,
          itemBId: itemB.id,
          resultItem: {
            id: `result_${Date.now()}`,
            name: name.trim(),
            image,
            description: description.trim(),
          },
          doc: {
            title: name.trim(),
            subtitle: '',
            story: story.trim(),
            formulaSteps: [],
            images: [image],
            notes: '',
            updatedAt: Date.now(),
          }
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm overflow-y-auto">
          <div className="mc-window w-full max-w-xl text-gray-900 overflow-hidden my-6">
            <div className="bg-[#3e3e3e] text-white px-4 py-2.5 flex items-center justify-between border-b-2 border-[#222]">
              <h2 className="font-pixel text-2xl">TỰ TẠO VẬT PHẨM KẾT QUẢ</h2>
              <button type="button" onClick={onClose} className="text-gray-300 hover:text-white">✕</button>
            </div>

            <div className="bg-[#b0b0b0] p-3 border-b-2 border-[#888] flex items-center justify-center gap-3">
              <span className="text-xs font-bold">{itemA.name}</span>
              <span className="font-pixel text-xl font-bold">+</span>
              <span className="text-xs font-bold">{itemB.name}</span>
              <span className="font-pixel text-xl font-bold text-amber-700">➔</span>
              <div className="w-9 h-9 mc-slot flex items-center justify-center bg-[#c0c0c0]">
                <img src={image} alt="Preview" className="w-7 h-7 object-contain pixelated" />
              </div>
            </div>

            <form onSubmit={handleSubmit} className="p-5 space-y-4">
              <div>
                <label className="block font-pixel text-lg font-bold mb-1">Tên Thành Phẩm *</label>
                <input
                  type="text"
                  required
                  placeholder="Nhập tên vật phẩm tạo ra..."
                  value={name}
                  onChange={e => setName(e.target.value)}
                  className="w-full px-3 py-2 bg-[#ededed] border-2 border-[#555] focus:outline-none"
                  autoFocus
                />
              </div>

              <div>
                <label className="block font-pixel text-lg font-bold mb-1">Hình Ảnh Thành Phẩm</label>
                <div className="space-y-2">
                  <label className="mc-button w-full py-2 text-sm font-pixel flex items-center justify-center gap-2 cursor-pointer bg-gray-200">
                    📂 <span>Tải ảnh từ máy tính</span>
                    <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
                  </label>
                  <div className="flex gap-2">
                    <input
                      type="url"
                      placeholder="Hoặc dán URL ảnh..."
                      value={customUrl}
                      onChange={e => setCustomUrl(e.target.value)}
                      className="flex-1 px-2.5 py-1 text-xs bg-[#ededed] border-2 border-[#666]"
                    />
                    <button
                      type="button"
                      onClick={() => { if (customUrl.trim()) { setImage(customUrl.trim()); setCustomUrl(''); } }}
                      className="mc-button px-3 py-1 font-pixel text-xs text-gray-800"
                    >
                      Dùng URL
                    </button>
                  </div>
                </div>
              </div>

              <div>
                <label className="block font-pixel text-lg font-bold mb-1">Chú Thích / Mô Tả</label>
                <input
                  type="text"
                  placeholder="Ghi chú ngắn về vật phẩm..."
                  value={description}
                  onChange={e => setDescription(e.target.value)}
                  className="w-full px-3 py-1.5 bg-[#ededed] border-2 border-[#555] text-sm"
                />
              </div>

              <div>
                <label className="block font-pixel text-lg font-bold mb-1">Văn Bản / Giới Thiệu (Lore)</label>
                <textarea
                  rows={3}
                  placeholder="Nội dung giới thiệu trên trang công thức (tuỳ chọn)..."
                  value={story}
                  onChange={e => setStory(e.target.value)}
                  className="w-full px-3 py-1.5 bg-[#ededed] border-2 border-[#555] text-sm"
                />
              </div>

              <div className="flex justify-end gap-2 pt-3 border-t border-gray-400">
                <button type="button" onClick={onClose} className="mc-button px-4 py-1.5 font-pixel text-lg">
                  Hủy
                </button>
                <button type="submit" className="mc-button-green px-5 py-1.5 font-pixel text-lg shadow">
                  Tạo Kết Quả
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- Trang Sách Công Thức (Đã xoá thuộc tính & chỉ số) ---
    function RecipePageView({ recipe, itemA, itemB, onBack, onUpdateRecipe }) {
      const [isEditing, setIsEditing] = useState(false);
      const [title, setTitle] = useState(recipe.doc.title || recipe.resultItem.name);
      const [subtitle, setSubtitle] = useState(recipe.doc.subtitle || '');
      const [story, setStory] = useState(recipe.doc.story || '');
      const [formulaSteps, setFormulaSteps] = useState(recipe.doc.formulaSteps || []);
      const [newStep, setNewStep] = useState('');
      const [images, setImages] = useState(recipe.doc.images || [recipe.resultItem.image]);
      const [notes, setNotes] = useState(recipe.doc.notes || '');

      const handleSave = () => {
        onUpdateRecipe({
          ...recipe,
          doc: {
            ...recipe.doc,
            title: title.trim(),
            subtitle: subtitle.trim(),
            story: story.trim(),
            formulaSteps,
            images,
            notes: notes.trim(),
            updatedAt: Date.now(),
          }
        });
        setIsEditing(false);
      };

      return (
        <div className="space-y-5 text-gray-900">
          <div className="flex items-center justify-between bg-[#242424] p-3 border-2 border-[#444] rounded text-white">
            <button
              onClick={onBack}
              className="mc-button px-4 py-1.5 font-pixel text-lg text-gray-800"
            >
              ← Quay Lại Bàn Chế Tạo
            </button>

            <div>
              {isEditing ? (
                <button
                  onClick={handleSave}
                  className="mc-button-green px-4 py-1.5 font-pixel text-lg shadow"
                >
                  💾 Lưu Trang Sách
                </button>
              ) : (
                <button
                  onClick={() => setIsEditing(true)}
                  className="mc-button px-4 py-1.5 font-pixel text-lg text-gray-800"
                >
                  ✎ Biên Soạn Lại
                </button>
              )}
            </div>
          </div>

          <div className="mc-window p-6 sm:p-8">
            <div className="border-b-4 border-gray-700 pb-4 mb-5 flex items-center justify-between">
              <div className="flex-1">
                {isEditing ? (
                  <input
                    type="text"
                    value={title}
                    onChange={e => setTitle(e.target.value)}
                    className="w-full text-3xl font-pixel font-bold px-2 py-1 bg-white border border-gray-600"
                  />
                ) : (
                  <h1 className="font-pixel text-4xl font-bold">{title}</h1>
                )}
                {subtitle && <p className="italic text-gray-600 text-sm mt-1">{subtitle}</p>}
              </div>

              <div className="mc-slot w-16 h-16 flex items-center justify-center bg-[#c6c6c6] shrink-0">
                <img src={images[0] || recipe.resultItem.image} alt={recipe.resultItem.name} className="w-12 h-12 object-contain pixelated" />
              </div>
            </div>

            <div className="space-y-5">
              {/* Sơ đồ công thức */}
              <div className="bg-[#b3b3b3] p-3 flex items-center gap-3 border border-gray-500">
                <div className="bg-[#d6d6d6] px-3 py-1.5 border border-gray-600 font-bold text-sm">
                  {itemA?.name || 'Nguyên liệu 1'}
                </div>
                <span className="font-pixel text-2xl font-bold">+</span>
                <div className="bg-[#d6d6d6] px-3 py-1.5 border border-gray-600 font-bold text-sm">
                  {itemB?.name || 'Nguyên liệu 2'}
                </div>
                <span className="font-pixel text-2xl font-bold text-amber-700">➔</span>
                <div className="bg-amber-100 px-3 py-1.5 border border-amber-600 font-bold text-sm text-amber-900">
                  {recipe.resultItem.name}
                </div>
              </div>

              {/* Văn bản */}
              <div className="bg-[#dedede] p-4 border border-gray-400">
                <h3 className="font-pixel text-2xl font-bold mb-2">Văn Bản & Cốt Truyện</h3>
                {isEditing ? (
                  <textarea
                    rows={5}
                    value={story}
                    onChange={e => setStory(e.target.value)}
                    className="w-full p-2 bg-white border border-gray-600 text-sm"
                  />
                ) : (
                  <p className="whitespace-pre-line bg-white/70 p-3 border border-gray-300 text-sm leading-relaxed">
                    {story || 'Chưa có nội dung văn bản.'}
                  </p>
                )}
              </div>

              {/* Các bước */}
              <div className="bg-[#dedede] p-4 border border-gray-400">
                <h3 className="font-pixel text-2xl font-bold mb-2">Quy Trình / Các Bước</h3>
                <ol className="space-y-1.5">
                  {formulaSteps.map((s, idx) => (
                    <li key={idx} className="bg-white p-2 border border-gray-300 flex justify-between text-sm">
                      <span><strong>#{idx + 1}:</strong> {s}</span>
                      {isEditing && (
                        <button onClick={() => setFormulaSteps(formulaSteps.filter((_, i) => i !== idx))} className="text-red-500 font-bold">✕</button>
                      )}
                    </li>
                  ))}
                </ol>
                {isEditing && (
                  <div className="mt-2 flex gap-2">
                    <input
                      type="text"
                      placeholder="Thêm bước..."
                      value={newStep}
                      onChange={e => setNewStep(e.target.value)}
                      className="flex-1 px-2 py-1 text-sm bg-white border border-gray-600"
                    />
                    <button
                      type="button"
                      onClick={() => { if (newStep.trim()) { setFormulaSteps([...formulaSteps, newStep.trim()]); setNewStep(''); } }}
                      className="mc-button px-3 py-1 font-pixel text-base"
                    >
                      + Thêm
                    </button>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render app vào DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
